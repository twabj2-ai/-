<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복권구매 계좌이체</title>
<style>
  :root{ --bg:#f5f6f4; --ink:#1c2321; --sub:#66706c; --line:#dfe3e0; --card:#fff; --accent:#d6336c; --btn:#0f6b4f; --btn-ink:#fff; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141a18; --ink:#eef2f0; --sub:#9aa5a0; --line:#2a3330; --card:#1c2422; --accent:#ff7aa8; --btn:#3fbf93; --btn-ink:#0b1512; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{ background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    display:flex; align-items:center; justify-content:center; }
  main{width:100%; max-width:420px}
  h1{font-size:22px; margin:0 0 4px}
  .sub{color:var(--sub); font-size:15px; margin:0 0 20px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 20px}
  .row{display:flex; justify-content:space-between; gap:12px; padding:12px 0; font-size:15px}
  .row + .row{border-top:1px solid var(--line)}
  .row span:first-child{color:var(--sub)}
  .acct{font-size:20px; font-weight:700; user-select:all; -webkit-user-select:all}
  .status{display:none; margin:16px 0 0; padding:14px 16px; border-radius:12px; font-size:15px; line-height:1.5; font-weight:600}
  .status.ok{display:block; background:rgba(15,107,79,.12); color:var(--btn)}
  .status.fail{display:block; background:rgba(214,51,108,.12); color:var(--accent)}
  .apps{display:none; gap:8px; margin-top:12px}
  .apps.on{display:grid}
  .btn,button{display:block; width:100%; border:0; border-radius:12px; padding:16px; font:inherit; font-size:16px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer}
  .apps .btn{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .again{background:transparent; color:var(--sub); margin-top:12px; font-size:14px; font-weight:500}

  /* 중앙 팝업 */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:20px}
  .overlay.on{display:flex}
  .box{background:var(--card); width:100%; max-width:340px; border:2px solid var(--ink); border-radius:24px; padding:28px 22px 22px; text-align:center; animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.box{animation:none}}
  .l1{font-size:15px; color:var(--sub); margin:0 0 14px}
  .l2{font-size:26px; font-weight:800; color:var(--accent); line-height:1.3; margin:0 0 24px; word-break:keep-all}
  .ok-btn{background:var(--btn); color:var(--btn-ink)}
  button:focus-visible,.btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>복권구매 계좌이체</h1>
  <p class="sub">아래 계좌로 이체해 주세요.</p>
  <div class="card">
    <div class="row"><span>은행</span><span id="bank"></span></div>
    <div class="row"><span>예금주</span><span id="holder"></span></div>
    <div class="row"><span>계좌번호</span><span class="acct" id="acct"></span></div>
  </div>
  <div class="status" id="status"></div>
  <div class="apps" id="apps"></div>
  <button class="again" id="again" type="button">계좌번호 다시 복사하기</button>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="l2">
  <div class="box">
    <p class="l1">복권구매 계좌번호 복사 완료</p>
    <p class="l2" id="l2">고객님의 은행앱을 열어 주세요</p>
    <button class="ok-btn" id="okBtn" type="button">확인</button>
  </div>
</div>

<script>
/* ===== 여기만 수정하세요 ===== */
const CONFIG = {
  bank: "케이뱅크",
  account: "100-301-168768",
  holder: "갑부복권",

/* =========================== */
const $ = (id) => document.getElementById(id);
const digits = CONFIG.account.replace(/\D/g, "");
const copyText = `${CONFIG.bank} ${digits}`;   // 복사되는 내용: 은행명 + 계좌번호
$("bank").textContent = CONFIG.bank;
$("holder").textContent = CONFIG.holder;
$("acct").textContent = CONFIG.account;
CONFIG.apps.forEach((a) => {
  const el = document.createElement("a");
  el.className = "btn"; el.textContent = a.name + " 열기";
  el.href = a.url({ ...CONFIG, digits });
  $("apps").appendChild(el);
});

async function copyAccount() {
  try { await navigator.clipboard.writeText(copyText); return true; }
  catch (e) {
    try {
      const t = document.createElement("textarea");
      t.value = copyText; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); return ok;
    } catch (_) { return false; }
  }
}

async function doCopy() {
  const ok = await copyAccount();
  const s = $("status");
  if (ok) {
    s.className = "status ok";
    s.textContent = "계좌번호가 복사되었습니다. 은행앱을 열어 붙여넣기 하세요.";
    $("apps").classList.add("on");
  } else {
    s.className = "status fail";
    s.textContent = "복사에 실패했습니다. 위 계좌번호를 길게 눌러 직접 복사해 주세요.";
    $("apps").classList.add("on");
  }
}

function leavePage() {
  document.body.innerHTML = "";              // 화면 즉시 비우기
  document.body.style.background = "#000";
  try { window.close(); } catch (e) {}       // 스캐너가 연 창이면 닫힘
  if (history.length > 1) history.back();    // 이전 화면이 있으면 복귀
  else setTimeout(() => location.replace("about:blank"), 50);
}

$("okBtn").addEventListener("click", async () => {
  const ok = await copyAccount();            // 확인을 누르는 순간 실제 복사
  if (ok) { leavePage(); return; }
  // 복사 실패 시에는 화면을 비우지 않고 직접 복사 안내
  $("overlay").classList.remove("on");
  const st = $("status");
  st.className = "status fail";
  st.textContent = "복사에 실패했습니다. 위 계좌번호를 길게 눌러 직접 복사해 주세요.";
  $("apps").classList.add("on");
});
$("again").addEventListener("click", doCopy);
window.addEventListener("load", () => $("overlay").classList.add("on"));
</script>
</body>
</html>
