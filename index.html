<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복권구매 계좌이체</title>
<style>
  :root{ --bg:#f5f6f4; --ink:#1c2321; --sub:#66706c; --line:#dfe3e0; --card:#fff; --accent:#d6336c; --btn:#0f6b4f; --btn-ink:#fff; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141a18; --ink:#eef2f0; --sub:#9aa5a0; --line:#2a3330; --card:#1c2422; --accent:#ff7aa8; --btn:#3fbf93; --btn-ink:#0b1512; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{ background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 24px); }
  .wrap{max-width:460px; margin:0 auto; padding-top:24px}
  h1{font-size:22px; margin:0 0 4px}
  .sub{color:var(--sub); font-size:15px; margin:0 0 20px; line-height:1.5}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 20px}
  .row{display:flex; justify-content:space-between; gap:12px; padding:12px 0; font-size:15px}
  .row + .row{border-top:1px solid var(--line)}
  .row span:first-child{color:var(--sub)}
  .acct{font-size:20px; font-weight:700}

  /* 중앙 팝업 */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:20px}
  .overlay.on{display:flex}
  .box{background:var(--card); width:100%; max-width:340px; border:2px solid var(--ink); border-radius:24px; padding:28px 22px 22px; text-align:center; animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.box{animation:none}}
  .l1{font-size:15px; color:var(--sub); margin:0 0 14px}
  .l2{font-size:26px; font-weight:800; color:var(--accent); line-height:1.3; margin:0 0 24px; word-break:keep-all}
  .ok-btn{display:block; width:100%; border:0; border-radius:12px; padding:16px; font:inherit; font-size:16px; font-weight:600; cursor:pointer; background:var(--btn); color:var(--btn-ink)}
  .ok-btn:focus-visible,.app:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  /* 은행앱 선택 화면 */
  #picker{display:none}
  .done{background:rgba(15,107,79,.12); color:var(--btn); font-weight:600; padding:12px 14px; border-radius:12px; font-size:15px; margin:0 0 6px}
  h2{font-size:14px; color:var(--sub); margin:22px 0 8px; font-weight:600}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .app{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:14px 10px; font:inherit; font-size:14px; font-weight:600; line-height:1.35; cursor:pointer; text-align:center; min-height:56px}
  .app small{display:block; color:var(--sub); font-weight:400; font-size:12px}
  .hint{position:sticky; bottom:12px; background:var(--ink); color:var(--bg); border-radius:12px; padding:12px 14px; font-size:14px; display:none; margin-top:16px}
  .hint.on{display:block}
</style>
</head>
<body>
<div class="wrap" id="info">
  <h1>복권구매 계좌이체</h1>
  <p class="sub">아래 계좌로 이체해 주세요.</p>
  <div class="card">
    <div class="row"><span>은행</span><span id="bank"></span></div>
    <div class="row"><span>예금주</span><span id="holder"></span></div>
    <div class="row"><span>계좌번호</span><span class="acct" id="acct"></span></div>
  </div>
</div>

<div class="wrap" id="picker">
  <p class="done">계좌번호를 복사했어요</p>
  <h1>사용하는 은행앱을 선택하세요</h1>
  <p class="sub">앱이 열리면 이체 화면의 계좌번호 입력란에 붙여넣기 하세요.</p>
  <div id="groups"></div>
  <div class="hint" id="hint">이 앱은 바로 열 수 없어요. 홈 화면에서 직접 열고 붙여넣기 하세요.</div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="l2">
  <div class="box">
    <p class="l1">복권구매 계좌번호 복사 완료</p>
    <p class="l2" id="l2">고객님의 은행앱을 열어 주세요</p>
    <button class="ok-btn" id="okBtn" type="button">확인</button>
  </div>
</div>

<script>
/* ===== 여기만 수정하세요 ===== */
const CONFIG = { bank: "농협은행", account: "123-4567-8901-23", holder: "홍길동" };

/* 은행앱 목록. pkg = 안드로이드 패키지명, scheme = 아이폰/안드로이드 앱 실행 주소.
   둘 다 비어 있으면 눌러도 앱이 열리지 않고 안내 문구만 나옵니다. 실제 폰에서 테스트해서 채우세요. */
const GROUPS = [
  ["시중은행·국책은행", [
    { name:"KB스타뱅킹", sub:"KB국민은행", pkg:"com.kbstar.kbbank", scheme:"kbbank://" },
    { name:"신한 SOL뱅크", sub:"신한은행", pkg:"com.shinhan.sbanking" },
    { name:"슈퍼 SOL", sub:"신한은행" },
    { name:"하나원큐", sub:"하나은행" },
    { name:"우리WON뱅킹", sub:"우리은행", pkg:"com.wooribank.smart.npib", scheme:"newsmartpib://" },
    { name:"NH올원뱅크", sub:"NH농협은행", pkg:"nh.smart.nhallonebank" },
    { name:"NH스마트뱅킹", sub:"NH농협은행", pkg:"nh.smart.banking" },
    { name:"NH콕뱅크", sub:"NH농협은행" },
    { name:"i-ONE Bank", sub:"IBK기업은행", pkg:"com.ibk.android.ionebank" },
    { name:"수협파트너뱅크", sub:"Sh수협은행" },
    { name:"쑥뱅크", sub:"Sh수협은행" },
    { name:"헤이뱅크", sub:"Sh수협은행" },
    { name:"SC제일은행", sub:"SC제일은행", pkg:"com.scbank.ma30" },
    { name:"씨티모바일", sub:"씨티은행" },
    { name:"스마트KDB", sub:"한국산업은행" },
  ]],
  ["인터넷전문은행", [
    { name:"카카오뱅크", sub:"카카오뱅크", pkg:"com.kakaobank.channel", scheme:"kakaobank://" },
    { name:"토스", sub:"토스뱅크", pkg:"viva.republica.toss", scheme:"supertoss://", toss:true },
    { name:"케이뱅크", sub:"케이뱅크", pkg:"com.kbankwithu.com" },
  ]],
  ["지방은행", [
    { name:"iM뱅크", sub:"iM뱅크" },
    { name:"부산은행 모바일뱅킹", sub:"BNK부산은행" },
    { name:"경남은행 모바일뱅킹", sub:"BNK경남은행" },
    { name:"광주WA뱅크", sub:"광주은행" },
    { name:"전북은행 쏙뱅크", sub:"전북은행" },
    { name:"제주SOL뱅크", sub:"제주은행" },
    { name:"J뱅크", sub:"제주은행" },
  ]],
  ["제2금융권·상호금융", [
    { name:"우체국 뱅킹", sub:"우체국", pkg:"com.epost.psf.sdsi" },
    { name:"MG더뱅킹", sub:"새마을금고", pkg:"kr.co.kfcc.mobilebank" },
    { name:"신협ON뱅크", sub:"신협" },
    { name:"SB톡톡플러스", sub:"저축은행중앙회" },
  ]],
];
/* =========================== */

const $ = (id) => document.getElementById(id);
const digits = CONFIG.account.replace(/\D/g, "");
const copyText = `${CONFIG.bank} ${digits}`;          // 복사되는 내용: 은행명 + 계좌번호
const isAndroid = /Android/i.test(navigator.userAgent);
$("bank").textContent = CONFIG.bank;
$("holder").textContent = CONFIG.holder;
$("acct").textContent = CONFIG.account;

async function copyAccount() {
  try { await navigator.clipboard.writeText(copyText); return true; }
  catch (e) {
    try {
      const t = document.createElement("textarea");
      t.value = copyText; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); return ok;
    } catch (_) { return false; }
  }
}

function openApp(a) {
  $("hint").classList.remove("on");
  if (a.toss) {                                        // 토스: 은행·계좌 미리 채운 송금 화면
    location.href = `supertoss://send?bank=${encodeURIComponent(CONFIG.bank.replace("은행",""))}&accountNo=${digits}`;
  } else if (isAndroid && a.pkg) {                     // 설치돼 있으면 실행, 없으면 플레이스토어
    location.href = `intent:#Intent;package=${a.pkg};S.browser_fallback_url=${encodeURIComponent("market://details?id=" + a.pkg)};end`;
  } else if (a.scheme) {
    location.href = a.scheme;
  } else {
    $("hint").classList.add("on");
  }
}

GROUPS.forEach(([title, apps]) => {
  const h = document.createElement("h2"); h.textContent = title;
  const g = document.createElement("div"); g.className = "grid";
  apps.forEach((a) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "app";
    b.innerHTML = `${a.name}<small>${a.sub}</small>`;
    b.addEventListener("click", () => openApp(a));
    g.appendChild(b);
  });
  $("groups").append(h, g);
});

$("okBtn").addEventListener("click", async () => {
  await copyAccount();                                 // 확인을 누르는 순간 복사
  $("overlay").classList.remove("on");
  $("info").style.display = "none";
  $("picker").style.display = "block";                 // 은행앱 선택 화면으로 전환
  window.scrollTo(0, 0);
});
window.addEventListener("load", () => $("overlay").classList.add("on"));
</script>
</body>
</html>
